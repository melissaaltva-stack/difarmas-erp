name: CI
run-name: Build DIFARMÁS ERP #${{ github.run_number }}

on:
  push:
    branches: [main, ci/verify-build, refactor/erp-architecture]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

