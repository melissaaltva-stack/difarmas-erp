name: CI
# Production build verification and dependency security audit for DIFARMÁS ERP.
run-name: Build DIFARMÁS ERP #${{ github.run_number }}

permissions:
  contents: read

on:
  push:
    branches: [main, ci/verify-build, refactor/erp-architecture]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install
      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('npm audit summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {name: v.name, title: v.title, range: v.range, url: v.url})
            }));
          }
          NODE
          npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
